name: kairis-dev
services:
  db:
    image: postgres:17-alpine
    container_name: kairis-dev-db
    ports: ["127.0.0.1:55433:5432"]
    environment:
      POSTGRES_USER: kairis
      POSTGRES_PASSWORD: kairis
      POSTGRES_DB: kairis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairis -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [kairis-dev-db:/var/lib/postgresql/data]
volumes:
  kairis-dev-db: {}
