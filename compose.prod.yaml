name: kairis
services:
  web:
    image: ${ECR_REGISTRY}/kairis-web:${IMAGE_TAG:-latest}
    container_name: kairis-web
    env_file:
      - { path: .env, required: false }
    # Loopback only, for the deploy health check; the tunnel reaches web:3000 over the compose
    # network. 3040 because the shared host's own sites hold 3000-3002 and 3021, fairsquare 3010.
    ports: ["127.0.0.1:3040:3000"]
    restart: always
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kairis-tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [web]
    restart: always
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
